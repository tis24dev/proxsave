name: Workflow Lint

run-name: Workflow lint - ${{ github.ref_name }}

"on":
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Both tools are release binaries pinned by version and verified by SHA-256
# before they run.
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      ACTIONLINT_VERSION: "1.7.12"
      # actionlint_1.7.12_linux_amd64.tar.gz, from actionlint_1.7.12_checksums.txt.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint

      # actionlint runs shellcheck (preinstalled on the runner) on every run: script.
      - name: Run actionlint
        run: |
          shellcheck --version
          "${RUNNER_TEMP}/actionlint" -version
          "${RUNNER_TEMP}/actionlint"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      ZIZMOR_VERSION: "1.31.1"
      # zizmor-x86_64-unknown-linux-gnu.tar.gz, the release asset digest.
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" zizmor

      # Regular persona. GH_TOKEN (read-only here) enables the online audits.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/zizmor" --version
          "${RUNNER_TEMP}/zizmor" --no-progress .github/workflows
