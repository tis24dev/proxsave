name: Dependency Review

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No later step uses the git remote, so don't leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # pinned from actions/dependency-review-action@v5.0.1
        with:
          # Blocca solo severity critical (zero-touch per gli altri)
          fail-on-severity: critical

          # Permetti solo licenze approvate
          # Note: golang.org/x/* include il file PATENTS, rilevato come LicenseRef-scancode-google-patent-license-golang.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, LicenseRef-scancode-google-patent-license-golang

          # Blocca dipendenze con licenze problematiche
          # deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

          # Commenta PR con dettagli vulnerabilità
          comment-summary-in-pr: always

          # Output formato per debugging
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
